## otsmail 本地开发配置（wrangler dev）
##
## 上游这个文件里带的是作者自己的 D1/KV ID 和一个写死的 jwt_secret，
## 对我们无效也不安全，已清空成模板。填自己的资源 ID 后使用：
##   npx wrangler d1 create otsmail-dev
##   npx wrangler kv namespace create otsmail-dev-kv
##
## 本地开发的 jwt_secret 可以直接写在这里（仅本机），但生产用
## `wrangler secret put jwt_secret`，不要写进 wrangler.toml。

name = "otsmail-dev"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[dev]
ip = "0.0.0.0"

[[d1_databases]]
binding = "db"
database_name = "otsmail-dev"
database_id = ""

[[kv_namespaces]]
binding = "kv"
id = ""

#[[r2_buckets]]
#binding = "r2"
#bucket_name = "otsmail-dev-r2"

#[ai]
#binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

#[[send_email]]
#name = "email"


[vars]
ai_model = ""
analysis_cache = false
orm_log = false
domain = ["example.com"]
admin = "admin@example.com"
jwt_secret = "dev-only-change-me"
